name: Build Nure Timetable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NureTimetable-Android16/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build ARM64 APK for Redmi Note 13 Pro
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore NureTimetable-Android16/NureTimetable.Maui.csproj

      - name: Create temporary signing key and publish APK
        shell: pwsh
        run: |
          $env:BUILD_KEY_PASSWORD = [guid]::NewGuid().ToString('N')
          $keystore = Join-Path $env:RUNNER_TEMP 'nuretimetable-build.jks'
          keytool -genkeypair -noprompt -v -keystore $keystore -alias nuretimetable -keyalg RSA -keysize 2048 -validity 3650 -storepass $env:BUILD_KEY_PASSWORD -keypass $env:BUILD_KEY_PASSWORD -dname 'CN=Nure Timetable Test, OU=Build, O=Personal, L=Kharkiv, ST=Kharkiv, C=UA'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the temporary Android signing key.' }
          dotnet publish NureTimetable-Android16/NureTimetable.Maui.csproj -c Release -f net11.0-android -p:AndroidTargetSdkVersion=36 -p:AndroidMinSdkVersion=24 -p:AndroidSupportedAbis=arm64-v8a -p:AndroidPackageFormats=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$keystore -p:AndroidSigningKeyAlias=nuretimetable -p:AndroidSigningKeyPass=env:BUILD_KEY_PASSWORD -p:AndroidSigningStorePass=env:BUILD_KEY_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw 'Android APK build failed.' }

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NureTimetable-Redmi-Note-13-Pro-Android16-APK
          path: 'NureTimetable-Android16/bin/Release/net11.0-android/publish/*.apk'
          if-no-files-found: error
          retention-days: 30
